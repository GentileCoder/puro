<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .ring, .utensil { fill: none; stroke: #111111; }
    .letter { fill: #111111; }
    @media (prefers-color-scheme: dark) {
      .ring, .utensil { stroke: #FFFFFF; }
      .letter { fill: #FFFFFF; }
    }
  </style>
  <circle class="ring" cx="32" cy="32" r="13" stroke-width="2.6"/>
  <circle class="ring" cx="32" cy="32" r="9" stroke-width="1.1" opacity="0.55"/>
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="14"
        class="letter">P</text>
  <!-- fork, left -->
  <g class="utensil" stroke-width="2.2" stroke-linecap="round">
    <line x1="5" y1="9" x2="5" y2="21"/><line x1="9" y1="9" x2="9" y2="21"/><line x1="13" y1="9" x2="13" y2="21"/>
    <path d="M5 21 Q5 26 9 26 Q13 26 13 21"/><line x1="9" y1="26" x2="9" y2="55"/>
  </g>
  <!-- wine glass, right -->
  <g class="utensil" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M51 9 L61 9 Q61 21 56 24 Q51 21 51 9 Z"/>
    <line x1="56" y1="24" x2="56" y2="50"/>
    <line x1="50" y1="55" x2="62" y2="55"/>
  </g>
</svg>
